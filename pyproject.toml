[project]
name = "manu"
version = "0.1.0"
description = "Manu: the case diary that reads the court for you. For Indian advocates, firms and judges, on the Chotu runtime."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dhee = ["dhee[openai,zvec,mcp]>=7.4.3,<8"]

[project.scripts]
manu = "manu.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manu"]

[tool.hatch.build.targets.wheel.force-include]
"src/manu/runtime/agents" = "manu/runtime/agents"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
